name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GOWORK: 'off'

jobs:
  check:
    name: Check Auth and production image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Verify dependency integrity and tidy state
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Install pinned quality tools
        run: make tools
      - name: Test quality enforcement
        run: make quality-test
      - name: Check module inventory, build, format, lint, architecture and race suite
        run: make check
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build checked production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: umir-auth-ci:sha-${{ github.sha }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start production entrypoint and check health/readiness
        env:
          CHECKED_IMAGE: umir-auth-ci:sha-${{ github.sha }}
          CHECKED_REVISION: ${{ github.sha }}
        run: sh tests/container/production-smoke.sh "$CHECKED_IMAGE" "$CHECKED_REVISION"
